[package]
name = "FixNewNotepad"
version = "0.1.0"
edition = "2021"

[dependencies]
slint = "1.3.2"
winreg = "0.52"
is_elevated = "0.1"
open = "5.0"
windows-sys = { version = "0.52", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winres = "0.1"
slint-build = "1.3.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true